[general]
import = ["~/.config/alacritty/themes/ayu_dark.toml"]

[env]
TERM = "xterm-256color"

[window]
opacity = 0.9
blur = true
dimensions = { columns = 200, lines = 85 }
padding = {x = 0, y=0}
dynamic_padding = true
decorations = "Buttonless"

[font]
size = 17
offset = { x = 0, y = 1 }

[font.normal]
family = "JetBrainsMono NF"
style = "Regular"

[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "F"
mods = "Command"
action = "ToggleFullscreen"
